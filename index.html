const FR="Lorsque Mathieu quitta la bibliothèque, il remarqua qu’un petit carnet était resté sur la table où il venait de travailler. Il l’ouvrit seulement pour découvrir à qui il appartenait. Les premières pages contenaient des notes ordinaires : des listes de livres, quelques dates et des observations sur les cours. Mais, à mesure qu’il avançait, il comprit que le carnet racontait surtout les difficultés d’un élève qui cherchait à poursuivre ses études malgré de nombreux obstacles.\n\nMathieu aurait pu remettre immédiatement le carnet au bibliothécaire. Pourtant, quelque chose le poussa à lire les dernières pages. Il y trouva une phrase qui le surprit : « Ce n’est pas l’absence de difficultés qui permet d’avancer, mais la décision de ne pas leur céder. » Cette phrase lui resta longtemps en tête.\n\nLe lendemain, Mathieu rapporta le carnet à la bibliothèque. Il ne chercha pas à connaître l’identité de son propriétaire. Il avait simplement le sentiment d’avoir découvert, par hasard, une leçon qui lui était destinée.";
const EN="Daniel had always believed that success meant being the best in everything he did. At school, he compared his grades with those of his classmates and became frustrated whenever someone performed better than him. Even when he achieved good results, he rarely felt satisfied because he was already thinking about the next person he had to beat.\n\nOne afternoon, his science teacher asked him to help a younger student who was struggling with a difficult lesson. At first, Daniel considered the task a waste of time. He wanted to use the afternoon to prepare for an important test. However, he eventually agreed.\n\nTo his surprise, explaining the lesson made Daniel understand several ideas that he had never completely mastered himself. More importantly, he realized that helping someone improve did not make his own achievements less valuable.\n\nFrom that day on, Daniel began to see success differently. Competition still mattered to him, but it was no longer the only measure he used to judge his progress.";
const sections={Anglais:[0,24,EN],Français:[25,49,FR],Mathématiques:[50,74,null],"Culture générale":[75,99,null]};
let shuffled=[],answers=Array(100).fill(null),i=0,qSec=60,rSec=900,qInt=null,rInt=null,startTime=0,spent=0,done=false,cheats=0,person="";

function fmt(s){s=Math.max(0,Math.floor(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function secOf(n){return Object.entries(sections).find(([k,v])=>n>=v[0]&&n<=v[1])}
function clearTimers(){if(qInt)clearInterval(qInt);if(rInt)clearInterval(rInt);qInt=rInt=null}
function mix(q){let a=q[3].map((x,j)=>({x,j}));for(let k=a.length-1;k>0;k--){let z=Math.floor(Math.random()*(k+1));[a[k],a[z]]=[a[z],a[k]]}return a}
shuffled=Q.map(mix);

document.getElementById('start').onclick=()=>{person=document.getElementById('name').value.trim()||'Participant';startTime=Date.now();document.getElementById('home').classList.add('hidden');document.getElementById('quiz').classList.remove('hidden');document.getElementById('who').textContent=person;setInterval(()=>{if(!done){spent=Math.floor((Date.now()-startTime)/1000);document.getElementById('spent').textContent=fmt(spent)}},500);render(i)};

function render(n){clearTimers();let [name,a,b]=secOf(n);if(b&&n===a) return reading(name,b,a);question(n)}

function reading(name,text,a){
 rSec=900;
 document.getElementById('stage').innerHTML='<div class="card"><div class="label">'+esc(name)+'</div><h2>LECTURE DU TEXTE</h2><div class="reading">'+esc(text)+'</div><div class="bigtime" id="rt">15:00</div><p class="center"><b>La lecture est prévue pour 15 minutes.</b></p><button class="skip" id="skip">PASSER AUX QUESTIONS MAINTENANT →</button></div>';
 document.getElementById('skip').onclick=()=>startQ(a);
 rInt=setInterval(()=>{rSec--;document.getElementById('rt').textContent=fmt(rSec);if(rSec<=0)startQ(a)},1000);
}

function startQ(n){clearTimers();i=n;qSec=60;question(n)}

function question(n){
 let [name,a,b]=secOf(n),q=Q[n],opts=shuffled[n];
 document.getElementById('stage').innerHTML='<div class="card"><div class="qtop"><div><div class="label">'+esc(name)+'</div><b>Question '+q[0]+' / 100</b></div><div class="qtimer" id="qt">01:00</div></div><div class="question">'+esc(q[2])+'</div><div class="options" id="ops"></div><div class="nav"><button class="next" id="next">VALIDER →</button></div></div>';
 let ops=document.getElementById('ops');
 opts.forEach((o,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML='<b>'+String.fromCharCode(65+k)+'.</b> '+esc(o.x);b.onclick=()=>{answers[n]=o.j;[...ops.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')};ops.appendChild(b)});
 if((name==='Anglais'||name==='Français')){let rb=document.createElement('button');rb.className='review';rb.textContent='📖 Revoir le texte';rb.onclick=()=>overlay(b);document.querySelector('.nav').before(rb)}
 document.getElementById('next').onclick=advance;
 qInt=setInterval(()=>{qSec--;document.getElementById('qt').textContent=fmt(qSec);if(qSec<=0)advance()},1000);
}
function overlay(text){let x=document.createElement('div');x.style='position:fixed;inset:0;background:#000d;z-index:90;padding:20px;overflow:auto';x.innerHTML='<div style="max-width:900px;margin:auto;background:#fff;border-radius:15px;padding:24px"><button id="close" style="float:right;background:#111;color:#fff">FERMER</button><h2>Texte</h2><div style="white-space:pre-line;line-height:1.7">'+esc(text)+'</div></div>';document.body.appendChild(x);x.querySelector('#close').onclick=()=>x.remove()}
function advance(){clearTimers();if(i===99)return finish();i++;let [name,a,b]=secOf(i);if(b&&i===a)reading(name,b,a);else startQ(i)}
function finish(){done=true;clearTimers();spent=Math.floor((Date.now()-startTime)/1000);document.getElementById('quiz').classList.add('hidden');showResults()}
function showResults(){
 let good=Q.reduce((s,q,n)=>s+(answers[n]===q[4]?1:0),0),by={};Q.forEach((q,n)=>{by[q[1]]??={c:0,t:0};by[q[1]].t++;if(answers[n]===q[4])by[q[1]].c++});
 let errors=Q.map((q,n)=>answers[n]===q[4]?'' : '<div class="err"><b>Q'+q[0]+' — '+esc(q[1])+'</b><br>'+esc(q[2])+'<br>Ta réponse : '+esc(answers[n]===null?'Aucune réponse':q[3][answers[n]])+'<br><span class="ok">Bonne réponse : '+esc(q[3][q[4]])+'</span><br><small>'+esc(q[5])+'</small></div>').join('');
 document.getElementById('results').classList.remove('hidden');document.getElementById('results').innerHTML='<div class="card"><div class="label">RÉSULTATS — '+esc(person)+'</div><div class="score">'+good+' / 100</div><h2>'+good+' %</h2><div class="stats"><div class="stat"><b>Temps total dépensé</b><br><strong>'+fmt(spent)+'</strong><br>'+Math.floor(spent/60)+' min '+String(spent%60).padStart(2,'0')+' s</div><div class="stat"><b>Bonnes réponses</b><br>'+good+'</div><div class="stat"><b>Erreurs</b><br>'+(100-good)+'</div><div class="stat"><b>Tentatives de triche</b><br>'+cheats+'</div></div><h2>Détail par matière</h2><div class="stats">'+Object.entries(by).map(([s,v])=>'<div class="stat"><b>'+esc(s)+'</b><br>'+v.c+' / '+v.t+'</div>').join('')+'</div><h2>Correction détaillée des erreurs</h2>'+(errors||'<p class="ok">Aucune erreur.</p>')+'</div><footer>by Nathan</footer>'
}

history.pushState(null,'',location.href);
addEventListener('popstate',()=>{history.pushState(null,'',location.href);if(!done){cheats++;warn('⚠️ TENTATIVE DE TRICHE DÉTECTÉE')}});
addEventListener('visibilitychange',()=>{if(document.hidden&&startTime&&!done){cheats++;warn('⚠️ TENTATIVE DE TRICHE DÉTECTÉE')}});
addEventListener('beforeunload',e=>{if(startTime&&!done){e.preventDefault();e.returnValue=''}});
function warn(t){let w=document.getElementById('warn');w.innerHTML=t+'<br><small>Le test continue.</small>';w.classList.remove('hidden');setTimeout(()=>w.classList.add('hidden'),2500)}
</script></body></html>
