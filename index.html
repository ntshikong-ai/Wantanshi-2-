d \"struggling\" in the text is closest in meaning to:", "options": ["succeeding", "having difficulty", "celebrating", "refusing"], "answer": 1, "explanation": "Struggling means having difficulty."}, {"subject": "Anglais", "text": "What is the main idea of the text?", "options": ["Competition is always harmful", "Helping others can change one's understanding of success", "School results are meaningless", "Teachers should give students less work"], "answer": 1, "explanation": "The text shows that helping others can transform one's view of success."}, {"subject": "Anglais", "text": "At the end, competition was:", "options": ["completely rejected by Daniel", "still important, but no longer his only measure of progress", "more important than before", "completely forgotten"], "answer": 1, "explanation": "Competition still mattered, but was no longer the only measure."}, {"subject": "Anglais", "text": "Which statement is TRUE according to the text?", "options": ["Daniel never obtained good grades", "Daniel refused to help the younger student", "Helping the student also benefited Daniel", "Daniel stopped preparing for examinations"], "answer": 2, "explanation": "Helping the student benefited Daniel academically."}, {"subject": "Anglais", "text": "\"Achievement\" is closest in meaning to:", "options": ["accomplishment", "failure", "difficulty", "punishment"], "answer": 0, "explanation": "Achievement means accomplishment."}, {"subject": "Anglais", "text": "\"Frustrated\" means:", "options": ["unable to achieve what one wants", "extremely relaxed", "completely surprised by success", "interested in travelling"], "answer": 0, "explanation": "Frustrated describes being unable to achieve what one wants."}, {"subject": "Anglais", "text": "\"Measure\" in \"a measure he used to judge his progress\" means:", "options": ["method of evaluating", "physical instrument", "distance", "punishment"], "answer": 0, "explanation": "Here, measure means a method or standard of evaluation."}, {"subject": "Anglais", "text": "\"Eventually\" means:", "options": ["immediately", "finally", "rarely", "previously"], "answer": 1, "explanation": "Eventually means finally."}, {"subject": "Anglais", "text": "\"Valuable\" is closest in meaning to:", "options": ["useless", "important", "ordinary", "temporary"], "answer": 1, "explanation": "Valuable means important or worthwhile."}, {"subject": "Anglais", "text": "If Daniel ___ earlier, he would have had more time to study.", "options": ["arrived", "had arrived", "arrives", "would arrive"], "answer": 1, "explanation": "Third conditional: if + past perfect."}, {"subject": "Anglais", "text": "She has studied English ___ three years.", "options": ["since", "during", "for", "from"], "answer": 2, "explanation": "For is used with a duration."}, {"subject": "Anglais", "text": "I am not used to ___ so early.", "options": ["wake", "waking", "woke", "have woken"], "answer": 1, "explanation": "Be used to is followed by a noun or gerund."}, {"subject": "Anglais", "text": "The teacher said that the students ___ the following day.", "options": ["would return", "will return", "return", "have returned"], "answer": 0, "explanation": "Reported speech changes will to would."}, {"subject": "Anglais", "text": "He succeeded ___ solving the problem.", "options": ["to", "at", "in", "on"], "answer": 2, "explanation": "The expression is succeed in doing something."}, {"subject": "Anglais", "text": "The student ___ helped Daniel was very young.", "options": ["which", "whose", "whom", "who"], "answer": 3, "explanation": "Who is the subject relative pronoun for a person."}, {"subject": "Anglais", "text": "You have finished your work, ___?", "options": ["haven't you", "have you", "don't you", "didn't you"], "answer": 0, "explanation": "A positive statement takes a negative tag."}, {"subject": "Anglais", "text": "Daniel enjoys ___ difficult problems.", "options": ["solve", "solving", "to solving", "solved"], "answer": 1, "explanation": "Enjoy is followed by a gerund."}, {"subject": "Anglais", "text": "The lesson ___ by the teacher yesterday.", "options": ["explained", "was explained", "has explained", "is explaining"], "answer": 1, "explanation": "Past passive: was explained."}, {"subject": "Anglais", "text": "I wish I ___ more time yesterday.", "options": ["have", "had", "had had", "would have"], "answer": 2, "explanation": "Past regret: wish + past perfect."}, {"subject": "Français", "text": "Pourquoi Mathieu ouvre-t-il d’abord le carnet?", "options": ["Pour lire les confidences de son propriétaire", "Pour découvrir à qui il appartient", "Pour chercher un livre", "Pour le conserver"], "answer": 1, "explanation": "Il l’ouvre pour découvrir à qui il appartient."}, {"subject": "Français", "text": "Que contenaient les premières pages?", "options": ["Des récits de voyage", "Des lettres personnelles", "Des notes, des dates et des observations", "Des exercices de mathématiques"], "answer": 2, "explanation": "Elles contenaient des listes de livres, des dates et des observations."}, {"subject": "Français", "text": "Que découvre progressivement Mathieu?", "options": ["Le carnet appartient au bibliothécaire", "Le carnet raconte les difficultés d’un élève", "L’élève a abandonné ses études", "Le carnet est ancien"], "answer": 1, "explanation": "Le carnet raconte les difficultés d’un élève."}, {"subject": "Français", "text": "Pourquoi Mathieu poursuit-il sa lecture?", "options": ["Une phrase attire particulièrement son attention", "Le bibliothécaire le lui demande", "Il veut connaître le nom de l’élève", "Il cherche une adresse"], "answer": 0, "explanation": "Une phrase des dernières pages le surprend."}, {"subject": "Français", "text": "Quelle idée exprime la phrase découverte par Mathieu?", "options": ["Les difficultés doivent toujours être évitées", "La réussite dépend uniquement de la chance", "La volonté de continuer malgré les difficultés est essentielle", "Les études sont inutiles"], "answer": 2, "explanation": "Elle ais", "text": "« Obstacles » désigne:", "options": ["des récompenses", "des difficultés qui empêchent ou ralentissent", "des connaissances", "des décisions"], "answer": 1, "explanation": "Les obstacles sont des difficultés."}, {"subject": "Français", "text": "« Cette phrase lui resta longtemps en tête » contient principalement:", "options": ["une hyperbole", "une personnification", "une métonymie", "une litote"], "answer": 1, "explanation": "Dans le cadre de ce QCM, la personnification est retenue."}, {"subject": "Français", "text": "« Une mer de problèmes » constitue:", "options": ["une comparaison", "une métaphore", "une anaphore", "une antithèse"], "answer": 1, "explanation": "C’est une métaphore."}, {"subject": "Français", "text": "Il faut que tu ___ attentivement cette consigne.", "options": ["lis", "lises", "liras", "lisais"], "answer": 1, "explanation": "Après « il faut que », on emploie le subjonctif."}, {"subject": "Français", "text": "Si j’avais su, je ___ plus tôt.", "options": ["viens", "viendrai", "serais venu", "venais"], "answer": 2, "explanation": "Hypothèse irréelle du passé: conditionnel passé."}, {"subject": "Français", "text": "Dès qu’il ___ son travail, il sortira.", "options": ["terminera", "terminait", "aura terminé", "aurait terminé"], "answer": 2, "explanation": "Le futur antérieur exprime l’action accomplie avant une autre au futur."}, {"subject": "Français", "text": "Quelle phrase est correctement écrite?", "options": ["Ils se sont parlé hier.", "Ils se sont parlés hier.", "Ils se sont parlées hier.", "Ils se sont parler hier."], "answer": 0, "explanation": "Se parler se construit avec un COI; pas d’accord du participe passé."}, {"subject": "Français", "text": "Quelle phrase est correcte?", "options": ["Quelque soient tes raisons, explique-les.", "Quelles que soient tes raisons, explique-les.", "Quelques soient tes raisons, explique-les.", "Quel que soient tes raisons, explique-les."], "answer": 1, "explanation": "La forme correcte est « quelles que soient »."}, {"subject": "Français", "text": "Dans « Le professeur explique la leçon aux élèves », « la leçon » est:", "options": ["COI", "COD", "sujet", "attribut du sujet"], "answer": 1, "explanation": "La leçon répond à « explique quoi? »: COD."}, {"subject": "Français", "text": "Dans « Les lettres que j’ai écrites », le participe passé « écrites » s’accorde parce que:", "options": ["le sujet est féminin", "le COD antéposé est « que »", "le verbe est pronominal", "le complément est indirect"], "answer": 1, "explanation": "« Que » reprend le COD « les lettres », placé avant."}, {"subject": "Français", "text": "Dans « Il faut travailler pour réussir », « pour réussir » est:", "options": ["une proposition subordonnée", "un groupe infinitif exprimant le but", "un COD", "un attribut"], "answer": 1, "explanation": "C’est un groupe infinitif exprimant le but."}, {"subject": "Français", "text": "Dans « Je pense qu’il viendra », « qu’il viendra » est:", "options": ["une subordonnée complétive", "une subordonnée relative", "une circonstancielle de cause", "une indépendante"], "answer": 0, "explanation": "Elle complète le verbe « pense »."}, {"subject": "Français", "text": "Quelle phrase est correctement accordée?", "options": ["Les fleurs que j’ai cueilli sont belles.", "Les fleurs que j’ai cueillies sont belles.", "Les fleurs que j’ai cueillis sont belles.", "Les fleurs que j’ai cueillies sont beaux."], "answer": 1, "explanation": "Le COD antéposé « que » reprend « les fleurs », donc « cueillies »."}, {"subject": "Mathématiques", "text": "Si 20 % d’un nombre vaut 36, ce nombre est:", "options": ["160", "180", "200", "216"], "answer": 1, "explanation": "36 / 0,20 = 180."}, {"subject": "Mathématiques", "text": "Une quantité augmente de 25 %, puis diminue de 20 %. Par rapport à la quantité initiale, elle est:", "options": ["inchangée", "augmentée de 5 %", "diminuée de 5 %", "augmentée de 10 %"], "answer": 0, "explanation": "1,25 × 0,80 = 1."}, {"subject": "Mathématiques", "text": "Pour x ≠ 3, l’expression (x² − 9)/(x − 3) est égale à:", "options": ["x − 3", "x + 3", "x² + 3", "x + 9"], "answer": 1, "explanation": "Factorisation: x²−9=(x−3)(x+3)."}, {"subject": "Mathématiques", "text": "Si a < 0 et b < 0, alors:", "options": ["ab < 0", "ab = 0", "ab > 0", "a/b < 0 toujours"], "answer": 2, "explanation": "Le produit de deux négatifs est positif."}, {"subject": "Mathématiques", "text": "L’ensemble des solutions de |x − 2| = 5 est:", "options": ["{5}", "{-3}", "{-3 ; 7}", "{3 ; 7}"], "answer": 2, "explanation": "x=7 ou x=−3."}, {"subject": "Mathématiques", "text": "La fonction f(x)=x² est:", "options": ["strictement croissante sur R", "strictement décroissante sur R", "paire", "impaire"], "answer": 2, "explanation": "f(−x)=f(x)."}, {"subject": "Mathématiques", "text": "L’axe de symétrie de la parabole y = x² − 6x + 5 est:", "options": ["x = −3", "x = 3", "x = 5", "x = 6"], "answer": 1, "explanation": "x=−b/(2a)=3."}, {"subject": "Mathématiques", "text": "Si f(x)=2x−7, alors f⁻¹(x) est:", "options": ["(x−7)/2", "(x+7)/2", "2x+7", "7−2x"], "answer": 1, "explanation": "y=2x−7 implique x=(y+7)/2."}, {"subject": "Mathématiques", "text": "La fonction f : R → R définie par f(x)=x³ est:", "options": ["injective seulement", "surjective seulement", "bijective", "ni injective ni surjective"], "answer": 2, "explanation": "x³ est bijective de R vers R."}, {"subject": "Mathématiques", "text": "Pour x>0, ln(x²) est égal à:", "options": ["ln(x)+2", "2ln(x)", "(ln x)²", "ln(x)/2"], "answer": 1, "explanation": "ln(x²)=2ln(x) pour x>0."}, {"subject": "Mathématiques", "text": "L’équation ln(x)=2 possède pour solution:", "options": ["x=2", "x=e²", "x=ln 2", "x=1/e²"], "answer": 1, "explanation": "x=e²."}, {"subject": "Mathématiques", "text": "La suite définie par uₙ = 3n + 2 est:", "options": ["géométrique", "arithmétique de raison 3", "arithmétique de raison 2", "constante"], "answer": 1, "explanation": "uₙ₊₁−uₙ=3."}, {"subject": "Mathématiques", " ": "30/4=7,5."}, {"subject": "Mathématiques", "text": "Si A ⊂ B, alors:", "options": ["tout élément de B appartient à A", "tout élément de A appartient à B", "A et B sont nécessairement égaux", "A et B sont disjoints"], "answer": 1, "explanation": "C’est la définition de A⊂B."}, {"subject": "Mathématiques", "text": "Une relation R sur un ensemble est une relation d’équivalence si elle est:", "options": ["seulement réflexive", "réflexive et symétrique", "réflexive, symétrique et transitive", "seulement transitive"], "answer": 2, "explanation": "Une relation d’équivalence est réflexive, symétrique et transitive."}, {"subject": "Mathématiques", "text": "Si a/b = c/d avec b,d ≠ 0, alors:", "options": ["ad = bc", "ab = cd", "ac = bd", "a+b = c+d"], "answer": 0, "explanation": "Produit en croix: ad=bc."}, {"subject": "Culture générale", "text": "Quelle est la capitale de la République démocratique du Congo?", "options": ["Lubumbashi", "Kisangani", "Kinshasa", "Kananga"], "answer": 2, "explanation": "La capitale est Kinshasa."}, {"subject": "Culture générale", "text": "Le fleuve Congo se jette dans:", "options": ["l’océan Indien", "l’océan Atlantique", "la mer Méditerranée", "le golfe d’Aden"], "answer": 1, "explanation": "Il se jette dans l’océan Atlantique."}, {"subject": "Culture générale", "text": "Le lac Tanganyika est partagé notamment par la RDC et:", "options": ["le Rwanda", "la Tanzanie", "l’Ouganda", "le Soudan du Sud"], "answer": 1, "explanation": "La Tanzanie partage notamment ce lac avec la RDC."}, {"subject": "Culture générale", "text": "Le parc national des Virunga est particulièrement connu pour:", "options": ["ses gorilles de montagne", "ses déserts", "ses récifs coralliens", "ses glaciers"], "answer": 0, "explanation": "Virunga est célèbre pour ses gorilles de montagne."}, {"subject": "Culture générale", "text": "Le volcan Nyiragongo se trouve près de:", "options": ["Lubumbashi", "Mbuji-Mayi", "Goma", "Matadi"], "answer": 2, "explanation": "Le Nyiragongo hants de mer"], "answer": 1, "explanation": "Il est notamment célèbre pour les gorilles de Grauer."}, {"subject": "Culture générale", "text": "Quel pays ne partage PAS de frontière avec la RDC?", "options": ["Angola", "Zambie", "Kenya", "République centrafricaine"], "answer": 2, "explanation": "Le Kenya n’a pas de frontière terrestre avec la RDC."}, {"subject": "Culture générale", "text": "La ligne qui sépare approximativement la Terre en deux hémisphères Nord et Sud est:", "options": ["le tropique du Cancer", "le méridien de Greenwich", "l’équateur", "le tropique du Capricorne"], "answer": 2, "explanation": "Il s’agit de l’équateur."}, {"subject": "Culture générale", "text": "Le plus grand océan du monde est:", "options": ["l’Atlantique", "l’Indien", "le Pacifique", "l’Arctique"], "answer": 2, "explanation": "Le Pacifique est le plus grand océan."}, {"subject": "Culture générale", "text": "La Première Guerre mondiale a commencé en:", "options": ["1912", "1914", "1916", "1918"], "answer": 1, "explanation": "Elle a commencé en 1914."}, {"subject": "Culture générale", "text": "La Seconde Guerre mondiale s’est terminée en:", "options": ["1943", "1944", "1945", "1946"], "answer": 2, "explanation": "Elle s’est terminée en 1945."}, {"subject": "Culture générale", "text": "L’Organisation des Nations unies a été créée en:", "options": ["1919", "1939", "1945", "1950"], "answer": 2, "explanation": "L’ONU a été créée en 1945."}, {"subject": "Culture générale", "text": "Quel continent compte le plus grand nombre de pays?", "options": ["Europe", "Afrique", "Asie", "Amérique du Sud"], "answer": 1, "explanation": "L’Afrique compte le plus grand nombre de pays."}, {"subject": "Culture générale", "text": "Le Sahara se trouve principalement:", "options": ["en Afrique australe", "en Afrique du Nord", "en Afrique centrale", "en Afrique orientale"], "answer": 1, "explanation": "Le Sahara se trouve principalement en Afrique du Nord."}, {"subject": "Culture générale", "text": "Quel est le const READINGS = {
  Anglais: `Daniel had always believed that success meant being the best in everything he did. At school, he compared his grades with those of his classmates and became frustrated whenever someone performed better than him. Even when he achieved good results, he rarely felt satisfied because he was already thinking about the next person he had to beat.

One afternoon, his science teacher asked him to help a younger student who was struggling with a difficult lesson. At first, Daniel considered the task a waste of time. He wanted to use the afternoon to prepare for an important test. However, he eventually agreed.

To his surprise, explaining the lesson made Daniel understand several ideas that he had never completely mastered himself. More importantly, he realized that helping someone improve did not make his own achievements less valuable.

From that day on, Daniel began to see success differently. Competition still mattered to him, but it was no longer the only measure he used to judge his progress.`,
  Français: `Lorsque Mathieu quitta la bibliothèque, il remarqua qu’un petit carnet était resté sur la table où il venait de travailler. Il l’ouvrit seulement pour découvrir à qui il appartenait. Les premières pages contenaient des notes ordinaires : des listes de livres, quelques dates et des observations sur les cours. Mais, à mesure qu’il avançait, il comprit que le carnet racontait surtout les difficultés d’un élève qui cherchait à poursuivre ses études malgré de nombreux obstacles.

Mathieu aurait pu remettre immédiatement le carnet au bibliothécaire. Pourtant, quelque chose le poussa à lire les dernières pages. Il y trouva une phrase qui le surprit : « Ce n’est pas l’absence de difficultés qui permet d’avancer, mais la décision de ne pas leur céder. » Cette phrase lui resta longtemps en tête.

Le lendemain, Mathieu rapporta le carnet à la bibliothèque. Il ne chercha pas à connaître l’identité de son propriétaire. Il avait simplement le sentiment d’avoir découvert, par hasard, une leçon qui lui était destinée.`
};

const app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clock=s=>String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");

let idx=0, answers=Array(100).fill(null), qLeft=60, readLeft=900, spent=0, timer=null, finished=false;

function stop(){clearInterval(timer);timer=null;}

function home(){
 app.innerHTML=`
 <div class="home">
  <div class="tag">PRÉPA EXCELLENTIA WANTANSHI</div>
  <div class="watermark">NATHAN</div>
  <h1>TEST BLANC — 100 QUESTIONS</h1>
  <input id="name" placeholder="Nom complet du participant">
  <button id="start">COMMENCER LE TEST</button>
  <p>25 questions par matière • 1 minute par question</p>
  <p>🇬🇧 15 min de lecture facultatives en anglais • 🇫🇷 15 min de lecture facultatives en français</p>
 </div>`;
 document.getElementById("start").onclick=()=>{
   if(!document.getElementById("name").value.trim()){alert("Veuillez saisir le nom complet.");return;}
   idx=0;answers.fill(null);spent=0;startReading("Anglais");
 };
}

function startReading(subject){
 stop();readLeft=900;
 app.innerHTML=`
 <div class="reading">
  <div class="tag">PHASE DE LECTURE</div>
  <h1>${esc(subject)}</h1>
  <div id="timer" class="big-timer">15:00</div>
  <p>La lecture dure au maximum 15 minutes. Elle est facultative.</p>
  <button id="skip">PASSER AUX QUESTIONS MAINTENANT →</button>
  <article>${esc(READINGS[subject])}</article>
 </div>`;
 document.getElementById("skip").onclick=question;
 timer=setInterval(()=>{
   readLeft--;
   document.getElementById("timer").textContent=clock(readLeft);
   if(readLeft<=0) question();
 },1000);
}

function question(){
 stop();qLeft=60;
 const q=QUESTIONS[idx];
 app.innerHTML=`
 <div class="quiz">
  <header><b>${esc(q.subject)} — Question ${idx+1}/100</b><strong id="timer">01:00</strong></header>
  <div class="bar"><i style="width:${idx+1}%"></i></div>
  <article>
   <h2>${esc(q.text)}</h2>
   <div class="options">${q.options.map((o,k)=>`<button data-k="${k}"><b>${String.fromCharCode(65+k)}.</b> ${esc(o)}</button>`).join("")}</div>
   ${(q.subject==="Anglais"||q.subject==="Français")?`<button class="secondary" id="review">👁 Jeter un coup d’œil au texte</button>`:""}
   <button id="next" class="next" disabled>${idx===99?"TERMINER":"QUESTION SUIVANTE →"}</button>
  </article>
 </div>`;

 document.querySelectorAll("[data-k]").forEach(b=>b.onclick=()=>{
   answers[idx]=+b.dataset.k;
   document.querySelectorAll("[data-k]").forEach(x=>x.classList.remove("selected"));
   b.classList.add("selected");
   const n=document.getElementById("next");n.disabled=false;
 });
 document.getElementById("next").onclick=advance;

 const review=document.getElementById("review");
 if(review)review.onclick=()=>{
   const box=document.createElement("div");box.className="modal";
   box.innerHTML=`<div><h2>Texte — ${esc(q.subject)}</h2><p>${esc(READINGS[q.subject])}</p><button id="close">FERMER</button></div>`;
   document.body.appendChild(box);
   document.getElementById("close").onclick=()=>box.remove();
 };

 timer=setInterval(()=>{
   qLeft--;spent++;
   document.getElementById("timer").textContent=clock(qLeft);
   if(qLeft<=0) advance();
 },1000);
}

function advance(){
 stop();
 if(answers[idx]===null && qLeft>0){alert("Choisissez une réponse avant de continuer.");return;}
 idx++;
 if(idx>=100){finish();return;}
 if(idx===25)startReading("Français"); else question();
}

function finish(){
 stop();finished=true;
 let score=0;QUESTIONS.forEach((q,i)=>{if(answers[i]===q.answer)score++;});
 const mins=Math.floor(spent/60),secs=spent%60;
 app.innerHTML=`
 <div class="results">
  <h1>TEST TERMINÉ</h1>
  <div class="score">${score}%</div>
  <p><b>${score}/100</b> bonnes réponses — ${100-score} erreur(s)</p>
  <div class="spent">⏱ Temps dépensé pendant les 100 questions : <b>${mins} min ${secs} s</b></div>
  <p>Temps mesuré : ${clock(spent)}</p>
  <h2>Détail des erreurs</h2>
  ${QUESTIONS.map((q,i)=>answers[i]!==q.answer?`
   <div class="error"><b>${i+1}. ${esc(q.text)}</b><br>
   Ta réponse : ${answers[i]===null?"Aucune":String.fromCharCode(65+answers[i])+". "+esc(q.options[answers[i]])}<br>
   Bonne réponse : <b>${String.fromCharCode(65+q.answer)}. ${esc(q.options[q.answer])}</b><br>
   <small>${esc(q.explanation)}</small></div>`:"").join("")}
  <footer>by Nathan</footer>
 </div>`;
}

document.addEventListener("visibilitychange",()=>{
 if(!finished && document.hidden) alert("⚠️ Tentative de triche détectée : le chronomètre continue.");
});
window.addEventListener("beforeunload",e=>{
 if(!finished){e.preventDefault();e.returnValue="";}
});
history.pushState(null,"",location.href);
window.addEventListener("popstate",()=>{
 if(!finished){alert("⚠️ Retour arrière interdit pendant le test.");history.pushState(null,"",location.href);}
});
home();
</script>
</body>
</html>
